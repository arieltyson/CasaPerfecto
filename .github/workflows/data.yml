name: Refresh data

on:
  schedule:
    # Mondays at 11:00 UTC (early morning in San Francisco).
    - cron: "0 11 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: false

jobs:
  refresh:
    name: Rebuild map, routing, safety and transit data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run pipeline -- --refresh
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
      - run: npm test
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data public/basemap
          if git diff --cached --quiet; then
            echo "Data unchanged."
          else
            git commit -m "chore(data): refresh open data $(date -u +%Y-%m-%d)"
            git push
          fi
